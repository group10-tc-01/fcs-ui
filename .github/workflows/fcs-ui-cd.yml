name: fcs-ui CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-scan-push:
    name: Build, scan, and push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          REGISTRY="${{ secrets.ACR_NAME }}.azurecr.io"
          IMAGE="${REGISTRY}/fcs-ui"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="sha-${SHORT_SHA}"
          {
            echo "image_tag=${TAG}"
            echo "tags<<EOF"
            echo "${IMAGE}:${TAG}"
            if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
              echo "${IMAGE}:main"
            fi
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              echo "${IMAGE}:${GITHUB_REF_NAME}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Fcs.UI.Web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_uri }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  deploy-aks:
    name: Deploy to AKS
    needs: build-scan-push
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    env:
      KUBECONFIG: /tmp/aks-kubeconfig
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AKS kubeconfig
        shell: bash
        run: |
          printf '%s' "${{ secrets.AKS_KUBECONFIG }}" > "${KUBECONFIG}"
          chmod 600 "${KUBECONFIG}"

      - name: Render manifests
        shell: bash
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          IMAGE_TAG: ${{ needs.build-scan-push.outputs.image_tag }}
        run: |
          find k8s/ -type f -name '*.yml' -print0 | xargs -0 sed -i \
            -e "s|__ACR_NAME__|${ACR_NAME}|g" \
            -e "s|__IMAGE_TAG__|${IMAGE_TAG}|g"

      - name: Apply manifests
        shell: bash
        run: kubectl apply -f k8s/ -n fcs-ui

      - name: Wait for rolling update
        shell: bash
        run: |
          kubectl rollout status deployment/fcs-ui -n fcs-ui --timeout=300s

      - name: Healthcheck
        shell: bash
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-all-errors \
            https://app.conexaosolidaria.com
